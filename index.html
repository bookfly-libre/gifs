<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beni-IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #020617;
      color: white;
    }
    .glass-panel {
      background: rgba(255, 255, 255, .04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, .06);
    }
    .loader {
      border-top-color: #8b5cf6;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .generated-gif {
      animation: gifMove 1.4s infinite ease-in-out alternate;
      transform-origin: center;
    }
    @keyframes gifMove {
      0% { transform: translateX(-18px) rotate(-1deg); }
      100% { transform: translateX(18px) rotate(1deg); }
    }
  </style>
</head>
<body>

  <nav class="p-6 flex justify-between border-b border-slate-800">
    <h1 class="text-3xl font-bold text-purple-400">BENI-IA</h1>
    <div class="space-x-8">
      <button onclick="switchTab('image')" class="hover:text-purple-400 transition">Imágenes</button>
      <button onclick="switchTab('video')" class="hover:text-blue-400 transition">Videos</button>
      <button onclick="switchTab('gif')" class="hover:text-emerald-400 transition">GIFs</button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-8 space-y-8">

    <section id="image-tab">
      <div class="glass-panel rounded-3xl p-8">
        <h2 class="text-3xl mb-4">Generador de Imágenes</h2>
        <textarea id="img-prompt" class="w-full p-5 rounded-xl bg-slate-900 focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="Describe la imagen"></textarea>
        <button onclick="generateImage()" class="mt-5 w-full py-4 rounded-xl bg-purple-600 font-semibold hover:bg-purple-700 transition">
          Generar Imagen
        </button>
      </div>
      <div id="image-result" class="hidden glass-panel rounded-3xl mt-8 p-8"></div>
    </section>

    <section id="video-tab" class="hidden">
      <div class="glass-panel rounded-3xl p-8">
        <h2 class="text-3xl mb-4">Crear Video</h2>
        <input id="video-upload" type="file" accept="image/*" class="w-full mb-4 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
        <input id="video-prompt" type="text" placeholder="Describe el movimiento" class="w-full p-4 rounded-xl bg-slate-900 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600">
        <button onclick="processVideo()" class="w-full py-4 rounded-xl bg-blue-600 font-semibold hover:bg-blue-700 transition">
          Crear Video
        </button>
      </div>
      <div id="video-result" class="hidden glass-panel rounded-3xl mt-8 p-8"></div>
    </section>

    <section id="gif-tab" class="hidden">
      <div class="glass-panel rounded-3xl p-8">
        <h2 class="text-3xl mb-4">Creador de GIFs</h2>
        <input id="gif-upload" type="file" accept="image/*" class="w-full mb-4 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700">
        <textarea id="gif-prompt" class="w-full p-4 rounded-xl bg-slate-900 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="Describe el movimiento..."></textarea>
        <button onclick="processGif()" class="w-full py-4 rounded-xl bg-emerald-600 font-semibold hover:bg-emerald-700 transition">
          Crear GIF
        </button>
      </div>
      <div id="gif-result" class="hidden glass-panel rounded-3xl mt-8 p-8"></div>
    </section>

  </main>

  <script>
    // Cambiar de pestañas y ocultar los resultados anteriores para evitar ruido visual
    function switchTab(tab) {
      document.querySelectorAll("main section").forEach(section => {
        section.classList.add("hidden");
      });
      document.getElementById(tab + "-tab").classList.remove("hidden");
    }

    // Muestra la animación de carga
    function showProcessing(containerId) {
      const container = document.getElementById(containerId);
      container.classList.remove("hidden");
      container.innerHTML = `
        <div class="flex flex-col items-center gap-5 min-h-[250px] justify-center">
          <div class="loader w-12 h-12 border-4 border-slate-700 rounded-full"></div>
          <p class="text-slate-400 animate-pulse">Procesando simulación de IA...</p>
        </div>
      `;
      return container;
    }

    /* IMAGEN */
    async function generateImage() {
      const prompt = document.getElementById("img-prompt").value.trim();
      if (!prompt) {
        alert("Por favor, escribe una descripción para la imagen.");
        return;
      }

      const container = showProcessing("image-result");
      await new Promise(resolve => setTimeout(resolve, 2500));

      container.innerHTML = `
        <img src="https://picsum.photos/1200/700?random=${Date.now()}" class="rounded-2xl mx-auto shadow-2xl">
        <p class="text-center text-purple-400 mt-4 italic">"${prompt}"</p>
      `;
    }

    /* VIDEO */
    async function processVideo() {
      const file = document.getElementById("video-upload").files[0];
      const prompt = document.getElementById("video-prompt").value.trim();

      if (!file || !prompt) {
        alert("Por favor, selecciona una imagen y describe el movimiento del video.");
        return;
      }

      const container = showProcessing("video-result");
      await new Promise(resolve => setTimeout(resolve, 2500));

      const url = URL.createObjectURL(file);
      container.innerHTML = `
        <img src="${url}" class="generated-gif rounded-2xl max-h-[500px] mx-auto shadow-2xl">
        <p class="text-center text-blue-400 mt-4 font-medium">
          Video generado correctamente
        </p>
        <p class="text-center text-slate-400 text-sm italic">Efecto: ${prompt}</p>
      `;
    }

    /* GIF */
    async function processGif() {
      const file = document.getElementById("gif-upload").files[0];
      const prompt = document.getElementById("gif-prompt").value.trim();

      // Validación preventiva: Si falta el archivo o el texto, avisa al usuario en vez de fallar en silencio
      if (!file || !prompt) {
        alert("Por favor, selecciona una imagen y describe el movimiento para el GIF.");
        return;
      }

      const container = showProcessing("gif-result");
      await new Promise(resolve => setTimeout(resolve, 2500));

      const url = URL.createObjectURL(file);
      container.innerHTML = `
        <div class="flex flex-col items-center gap-4">
          <img src="${url}" class="generated-gif rounded-2xl max-h-[500px] mx-auto shadow-2xl">
          <p class="text-emerald-400 text-lg font-medium">
            GIF generado correctamente
          </p>
          <p class="text-slate-400 text-sm italic">Animación basada en: "${prompt}"</p>
        </div>
      `;
    }
  </script>
</body>
</html>
