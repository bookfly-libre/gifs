<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beni-IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #020617;
      color: white;
    }
    .glass-panel {
      background: rgba(255, 255, 255, .04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, .06);
    }
    .loader {
      border-top-color: #8b5cf6;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .generated-gif {
      animation: gifMove 1.4s infinite ease-in-out alternate;
      transform-origin: center;
    }
    @keyframes gifMove {
      0% {
    transform: translateX(-40px);
  }

  100% {
    transform: translateX(40px);
  }
}

@keyframes handWave {
  0% {
    transform: rotate(-12deg);
  }

  100% {
    transform: rotate(12deg);
  }
}

@keyframes upDown {
  0% {
    transform: translateY(-20px);
  }

  100% {
    transform: translateY(20px);
  }
}

@keyframes spinSlow {
  0% {
    transform: rotate(-8deg);
  }

  100% {
    transform: rotate(8deg);
  }
}
  </style>
</head>
<body>

  <nav class="p-6 flex justify-between border-b border-slate-800">
    <h1 class="text-3xl font-bold text-purple-400">BENI-IA</h1>
    <div class="space-x-8">
      <button onclick="switchTab('image')" class="hover:text-purple-400 transition">Imágenes</button>
      <button onclick="switchTab('video')" class="hover:text-blue-400 transition">Videos</button>
      <button onclick="switchTab('gif')" class="hover:text-emerald-400 transition">GIFs</button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-8 space-y-8">

    <section id="image-tab">
      <div class="glass-panel rounded-3xl p-8">
        <h2 class="text-3xl mb-4">Generador de Imágenes</h2>
        <textarea id="img-prompt" class="w-full p-5 rounded-xl bg-slate-900 focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="Describe la imagen"></textarea>
        <button onclick="generateImage()" class="mt-5 w-full py-4 rounded-xl bg-purple-600 font-semibold hover:bg-purple-700 transition">
          Generar Imagen
        </button>
      </div>
      <div id="image-result" class="hidden glass-panel rounded-3xl mt-8 p-8"></div>
    </section>

    <section id="video-tab" class="hidden">
      <div class="glass-panel rounded-3xl p-8">
        <h2 class="text-3xl mb-4">Crear Video</h2>
        <input id="video-upload" type="file" accept="image/*" class="w-full mb-4 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
        <input id="video-prompt" type="text" placeholder="Describe el movimiento" class="w-full p-4 rounded-xl bg-slate-900 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600">
        <button onclick="processVideo()" class="w-full py-4 rounded-xl bg-blue-600 font-semibold hover:bg-blue-700 transition">
          Crear Video
        </button>
      </div>
      <div id="video-result" class="hidden glass-panel rounded-3xl mt-8 p-8"></div>
    </section>

    <section id="gif-tab" class="hidden">
      <div class="glass-panel rounded-3xl p-8">
        <h2 class="text-3xl mb-4">Creador de GIFs</h2>
        <input id="gif-upload" type="file" accept="image/*" class="w-full mb-4 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700">
        <textarea id="gif-prompt" class="w-full p-4 rounded-xl bg-slate-900 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="Describe el movimiento..."></textarea>
        <button onclick="processGif()" class="w-full py-4 rounded-xl bg-emerald-600 font-semibold hover:bg-emerald-700 transition">
          Crear GIF
        </button>
      </div>
      <div id="gif-result" class="hidden glass-panel rounded-3xl mt-8 p-8"></div>
    </section>

  </main>
<script>
const REPLICATE_API_TOKEN =
  prompt("Pega tu Replicate API token");

function switchTab(tab) {
  document.querySelectorAll("main section").forEach(section => {
    section.classList.add("hidden");
  });

  document
    .getElementById(tab + "-tab")
    .classList.remove("hidden");
}

function showProcessing(containerId) {
  const container =
    document.getElementById(containerId);

  container.classList.remove("hidden");

  container.innerHTML = `
    <div class="flex flex-col items-center gap-5 min-h-[250px] justify-center">
      <div class="loader w-12 h-12 border-4 border-slate-700 rounded-full"></div>
      <p class="text-slate-400 animate-pulse">
        Procesando IA...
      </p>
    </div>
  `;

  return container;
}

async function generateImage() {
  const prompt =
    document.getElementById("img-prompt").value.trim();

  if (!prompt) {
    alert("Por favor, escribe una descripción.");
    return;
  }

  const container =
    showProcessing("image-result");

  await new Promise(resolve =>
    setTimeout(resolve, 1500)
  );

  container.innerHTML = `
    <img
      src="https://picsum.photos/1200/700?random=${Date.now()}"
      class="rounded-2xl mx-auto shadow-2xl"
    >
    <p class="text-center text-purple-400 mt-4 italic">
      "${prompt}"
    </p>
  `;
}

async function processVideo() {
  const file =
    document.getElementById("video-upload").files[0];

  const prompt =
    document.getElementById("video-prompt").value.trim();

  if (!file || !prompt) {
    alert("Selecciona imagen y describe el movimiento.");
    return;
  }

  const container =
    showProcessing("video-result");

  const url =
    URL.createObjectURL(file);

  await new Promise(resolve =>
    setTimeout(resolve, 1200)
  );

  container.innerHTML = `
    <video
      controls
      autoplay
      loop
      muted
      class="rounded-2xl mx-auto max-h-[500px]"
    >
      <source src="${url}">
    </video>

    <p class="text-center text-blue-400 mt-4">
      "${prompt}"
    </p>
  `;
}

async function processGif() {
  const file =
    document.getElementById("gif-upload").files[0];

  const prompt =
    document.getElementById("gif-prompt").value.trim();

  if (!file || !prompt) {
    alert("Selecciona imagen y escribe el movimiento.");
    return;
  }

  const container =
    showProcessing("gif-result");

  try {
    const formData = new FormData();

    formData.append("file", file);

    const uploadResponse =
      await fetch(
        "https://api.replicate.com/v1/files",
        {
          method: "POST",
          headers: {
            Authorization: `Token ${REPLICATE_API_TOKEN}`
          },
          body: formData
        }
      );

    const uploadData =
      await uploadResponse.json();

    const predictionResponse =
      await fetch(
        "https://api.replicate.com/v1/predictions",
        {
          method: "POST",

          headers: {
            Authorization: `Token ${REPLICATE_API_TOKEN}`,
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            version: "minimax/video-01-live",

            input: {
              prompt: prompt,
              image: uploadData.urls.get
            }
          })
        }
      );

    const prediction =
      await predictionResponse.json();

    let resultUrl = null;

    while (!resultUrl) {
      await new Promise(resolve =>
        setTimeout(resolve, 3000)
      );

      const poll =
        await fetch(
          `https://api.replicate.com/v1/predictions/${prediction.id}`,
          {
            headers: {
              Authorization: `Token ${REPLICATE_API_TOKEN}`
            }
          }
        );

      const data =
        await poll.json();

      if (data.status === "succeeded") {
        resultUrl =
          data.output?.[0];
      }

      if (data.status === "failed") {
        throw new Error("Falló la generación");
      }
    }

    container.innerHTML = `
      <video
        autoplay
        loop
        muted
        controls
        class="rounded-2xl mx-auto max-h-[600px]"
      >
        <source src="${resultUrl}" type="video/mp4">
      </video>

      <p class="text-emerald-400 text-center mt-4">
        GIF generado correctamente
      </p>
    `;

  } catch (error) {
    console.error(error);

    container.innerHTML = `
      <p class="text-red-400 text-center">
        Error al generar el GIF
      </p>
    `;
  }
}
</script>
  <script>
 
</script>
  
</body>
</html>
