<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beni-IA | Centro de Creación Visual</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
rel="stylesheet">

<style>

body{
    font-family:'Inter',sans-serif;
    background:#020617;
}

.glass-panel{
    background:rgba(255,255,255,.03);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.06);
}

.loader{
    border-top-color:#8b5cf6;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body class="text-white min-h-screen">

<nav class="p-6 flex justify-between items-center border-b border-slate-800">

<h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
BENI-IA
</h1>

<div class="space-x-8">

<button onclick="switchTab('image')" class="hover:text-blue-400">
Imágenes
</button>

<button onclick="switchTab('video')" class="hover:text-blue-400">
Videos
</button>

<button onclick="switchTab('gif')" class="hover:text-blue-400">
GIFs
</button>

</div>

</nav>



<main class="max-w-4xl mx-auto p-8 space-y-8">

<!-- IMÁGENES -->
<section id="image-tab" class="space-y-8">

<div class="glass-panel p-8 rounded-3xl">

<h2 class="text-3xl font-semibold mb-5">
Generador de Imágenes
</h2>

<textarea
id="img-prompt"
class="w-full h-36 p-5 bg-slate-900 rounded-xl border border-slate-700"
placeholder="Describe la imagen que deseas crear..."></textarea>

<button
onclick="generateImage()"
class="mt-5 w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-xl font-bold">
Generar Imagen
</button>

</div>

<div
id="image-result"
class="glass-panel rounded-3xl hidden min-h-[320px] p-6">
</div>

</section>



<!-- VIDEO -->
<section id="video-tab" class="hidden space-y-8">

<div class="glass-panel p-8 rounded-3xl">

<h2 class="text-3xl font-semibold mb-5">
Transformación a Video
</h2>

<input
type="file"
id="video-upload"
accept="image/*"
class="w-full p-4 bg-slate-900 rounded-xl mb-5">

<input
type="text"
id="video-prompt"
class="w-full p-4 bg-slate-900 rounded-xl border border-slate-700 mb-5"
placeholder="¿Qué acción debe realizar el video?">

<button
onclick="processVideo()"
class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-bold">
Crear Video
</button>

</div>

<div
id="video-result"
class="glass-panel rounded-3xl hidden min-h-[320px] p-6">
</div>

</section>



<!-- GIF -->
<section id="gif-tab" class="hidden space-y-8">

<div class="glass-panel p-8 rounded-3xl">

<h2 class="text-3xl font-semibold mb-5">
Creador de GIFs
</h2>

<input
type="file"
id="gif-upload"
accept="image/*"
class="w-full p-4 bg-slate-900 rounded-xl mb-5">

<textarea
id="gif-prompt"
class="w-full h-28 p-5 bg-slate-900 rounded-xl border border-slate-700 mb-5"
placeholder="Describe el movimiento o efecto para el GIF..."></textarea>

<button
onclick="processGif()"
class="w-full bg-emerald-600 hover:bg-emerald-700 py-4 rounded-xl font-bold">
Crear GIF
</button>

</div>

<div
id="gif-result"
class="glass-panel rounded-3xl hidden min-h-[320px] p-6">
</div>

</section>

</main>



<script>

function switchTab(tabName){

document
.querySelectorAll("main > section")
.forEach(section=>{
section.classList.add("hidden");
});

document
.getElementById(tabName + "-tab")
.classList.remove("hidden");

}



function showProcessing(containerId){

const container=document.getElementById(containerId);

container.classList.remove("hidden");

container.innerHTML=`

<div class="flex flex-col items-center justify-center min-h-[280px] gap-5">

<div class="loader w-12 h-12 border-4 border-slate-700 rounded-full"></div>

<p class="text-xl font-semibold">
Procesando...
</p>

<p class="text-slate-400">
La IA está generando tu contenido
</p>

</div>

`;

return container;

}



/* IMAGEN */

async function generateImage(){

const prompt=document.getElementById("img-prompt").value.trim();

if(!prompt) return;

const container=showProcessing("image-result");

try{

await new Promise(resolve=>setTimeout(resolve,2500));

container.innerHTML=`

<div class="flex justify-center">

<img
src="https://picsum.photos/1280/720?random=${Date.now()}"
class="rounded-2xl max-w-full shadow-xl">

</div>

`;

}catch(error){

container.innerHTML=`
<p class="text-red-400">
Error al generar la imagen
</p>
`;

}

}



/* VIDEO */

async function processVideo(){

const fileInput=document.getElementById("video-upload");

const prompt=document.getElementById("video-prompt").value.trim();

if(!fileInput.files.length || !prompt){
return;
}

const file=fileInput.files[0];

const container=showProcessing("video-result");

try{

await new Promise(resolve=>setTimeout(resolve,3000));

const fileURL=URL.createObjectURL(file);

container.innerHTML=`

<div class="flex flex-col items-center gap-5">

<img
src="${fileURL}"
class="rounded-2xl max-w-full max-h-[500px] object-contain shadow-xl">

<p class="text-blue-400 font-semibold">
Vista previa del video generada correctamente
</p>

</div>

`;

}catch(error){

container.innerHTML=`
<p class="text-red-400">
Error al crear el video
</p>
`;

}

}



/* GIF */

async function processGif(){

const fileInput=document.getElementById("gif-upload");

const prompt=document.getElementById("gif-prompt").value.trim();

if(!fileInput.files.length || !prompt){
return;
}

const file=fileInput.files[0];

const container=showProcessing("gif-result");

try{

await new Promise(resolve=>setTimeout(resolve,2500));

const fileURL=URL.createObjectURL(file);

container.innerHTML=`

<div class="flex flex-col items-center gap-5">

<img
src="${fileURL}"
class="rounded-2xl max-w-full max-h-[500px] object-contain shadow-xl">

<p class="text-emerald-400 font-semibold">
GIF generado correctamente
</p>

</div>

`;

}catch(error){

container.innerHTML=`
<p class="text-red-400">
Error al crear el GIF
</p>
`;

}

}

</script>

</body>
</html>
