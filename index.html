<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Beni-IA | Centro de Creación Visual</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Inter',sans-serif;
}

.glass-panel{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.08);
}

.loader{
    border-top-color:#8b5cf6;
    animation:spinner 1s linear infinite;
}

@keyframes spinner{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body class="bg-slate-950 text-white min-h-screen">

<nav class="p-6 flex justify-between items-center border-b border-slate-800">
    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
        BENI-IA
    </h1>

    <div class="space-x-4">
        <button onclick="switchTab('image')" class="px-4 py-2 hover:text-blue-400">Imágenes</button>
        <button onclick="switchTab('video')" class="px-4 py-2 hover:text-blue-400">Videos</button>
        <button onclick="switchTab('gif')" class="px-4 py-2 hover:text-blue-400">GIFs</button>
    </div>
</nav>

<main class="max-w-4xl mx-auto p-6">

<!-- IMAGEN -->
<section id="image-tab" class="space-y-6">

<div class="glass-panel p-8 rounded-2xl">
<h2 class="text-2xl font-semibold mb-4">Generador de Imágenes</h2>

<textarea
id="img-prompt"
class="w-full h-32 p-4 bg-slate-900 rounded-lg border border-slate-700"
placeholder="Describe la imagen..."></textarea>

<button
onclick="generateImage()"
class="mt-4 w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-lg font-bold">
Generar Imagen
</button>
</div>

<div
id="image-result"
class="glass-panel rounded-2xl hidden min-h-[320px] p-6">
</div>

</section>

<!-- VIDEO -->
<section id="video-tab" class="hidden space-y-6">

<div class="glass-panel p-8 rounded-2xl">

<h2 class="text-2xl font-semibold mb-4">
Transformación a Video
</h2>

<input
type="file"
id="video-upload"
accept="image/*"
class="w-full p-4 bg-slate-900 rounded-lg mb-4"/>

<input
type="text"
id="video-prompt"
class="w-full p-4 bg-slate-900 rounded-lg border border-slate-700 mb-4"
placeholder="¿Qué acción debe realizar el video?"/>

<button
onclick="processVideo()"
class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-bold">
Crear Video
</button>

</div>

<div
id="video-result"
class="glass-panel rounded-2xl hidden min-h-[320px] p-6">
</div>

</section>

<!-- GIF -->
<section id="gif-tab" class="hidden space-y-6">

<div class="glass-panel p-8 rounded-2xl">

<h2 class="text-2xl font-semibold mb-4">
Creador de GIFs
</h2>

<input
type="file"
id="gif-upload"
accept="image/*"
class="w-full p-4 bg-slate-900 rounded-lg mb-4"/>

<textarea
id="gif-prompt"
class="w-full h-24 p-4 bg-slate-900 rounded-lg border border-slate-700 mb-4"
placeholder="Describe el movimiento del GIF..."></textarea>

<button
onclick="processGif()"
class="w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded-lg font-bold">
Crear GIF
</button>

</div>

<div
id="gif-result"
class="glass-panel rounded-2xl hidden min-h-[320px] p-6">
</div>

</section>

</main>

<script>

function switchTab(tabName){
    document
        .querySelectorAll("main > section")
        .forEach(section => section.classList.add("hidden"));

    document
        .getElementById(`${tabName}-tab`)
        .classList.remove("hidden");
}

function showProcessing(containerId){

    const container = document.getElementById(containerId);

    container.classList.remove("hidden");

    container.innerHTML = `
        <div class="flex flex-col items-center justify-center min-h-[280px] gap-5">
            <div class="loader w-12 h-12 border-4 border-slate-700 rounded-full"></div>

            <p class="text-lg font-semibold text-slate-200">
                Procesando...
            </p>

            <p class="text-sm text-slate-400">
                La IA está generando tu contenido
            </p>
        </div>
    `;

    return container;
}

/* IMAGEN */
async function generateImage(){

    const prompt = document.getElementById("img-prompt").value.trim();

    if(!prompt) return;

    const container = showProcessing("image-result");

    try{

        const payload = {
            contents:[
                {
                    role:"user",
                    parts:[
                        {text:prompt}
                    ]
                }
            ],
            generationConfig:{
                responseModalities:["IMAGE"],
                imageConfig:{
                    aspectRatio:"16:9"
                }
            }
        };

        const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image-preview:generateContent?key=",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(payload)
            }
        );

        const result = await response.json();

        const part =
            result?.candidates?.[0]?.content?.parts?.find(
                p => p.inlineData
            );

        if(part){

            container.innerHTML = `
                <img
                    src="data:${part.inlineData.mimeType};base64,${part.inlineData.data}"
                    class="rounded-xl max-w-full mx-auto"
                />
            `;

        }else{

            container.innerHTML = `
                <p class="text-red-400">
                    No se pudo generar la imagen.
                </p>
            `;
        }

    }catch(err){

        container.innerHTML = `
            <p class="text-yellow-400">
                Error de conexión o API Key no válida.
            </p>
        `;
    }
}


/* VIDEO */
async function processVideo(){

    const container = showProcessing("video-result");

    try{

        await new Promise(resolve =>
            setTimeout(resolve, 3500)
        );

        container.innerHTML = `
            <video
                controls
                autoplay
                loop
                class="rounded-xl max-w-full mx-auto">
                <source src="TU_VIDEO_GENERADO.mp4" type="video/mp4">
            </video>
        `;

    }catch(err){

        container.innerHTML = `
            <p class="text-red-400">
                Error al crear el video.
            </p>
        `;
    }
}


/* GIF */
async function processGif(){

    const container = showProcessing("gif-result");

    try{

        await new Promise(resolve =>
            setTimeout(resolve, 2500)
        );

        container.innerHTML = `
            <img
                src="TU_GIF_GENERADO.gif"
                class="rounded-xl max-w-full mx-auto"
                alt="GIF generado"
            />
        `;

    }catch(err){

        container.innerHTML = `
            <p class="text-red-400">
                Error al crear el GIF.
            </p>
        `;
    }
}

</script>
</body>
</html>
